<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Send Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Send Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<script>window.__PWA__ = true;</script>
<style>
/* Send Log — chalk paper, ink rules, condensed Archivo numbers, teal for action and good. Light only. */
:root {
  --paper: #F2EFE9;
  --card: #FBFAF7;
  --sand: #E6E1D7;
  --ink: #1D1C1A;
  --muted: #6A665F;
  --body: #4A4741;
  --rule: #CFC9BE;
  --rule-soft: #DAD4C9;
  --chip: #BDB6A9;
  --teal: #0B5F5E;
  --teal-bg: #DCEBE8;
  --warn: #B4461A;
  --warn-bg: #F6E3D8;
  --warn-ink: #6E2A0C;
  --font: 'Archivo', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
a { color: var(--ink); }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; padding-top: env(safe-area-inset-top, 0px); }
.top { flex: none; padding: 14px 20px 12px; border-bottom: 3px solid var(--ink); display: flex; flex-direction: column; gap: 6px; }
.top:empty { display: none; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.foot { flex: none; padding: 10px 20px 10px; border-top: 3px solid var(--ink); display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.foot.last { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }

/* type */
.eyebrow, .lbl { font-size: 12px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.lbl.ink { color: var(--ink); }
.lbl.teal { color: var(--teal); }
.h1 { margin: 0; font-size: 52px; font-weight: 900; font-stretch: 62%; line-height: 0.9; text-transform: uppercase; letter-spacing: 0.005em; }
.h2 { margin: 0; font-size: 13px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.12em; text-transform: uppercase; }
.num { font-weight: 900; font-stretch: 62%; font-variant-numeric: tabular-nums; line-height: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; color: var(--muted); line-height: 1.45; }
.body { font-size: 13px; line-height: 1.45; color: var(--body); }
.teal { color: var(--teal); }
.warn { color: var(--warn); }
.wide { width: 100%; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row.base { align-items: baseline; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack.g10 { gap: 10px; }
.wrap { display: flex; gap: 6px; flex-wrap: wrap; }
.hscroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.sec { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.sec:first-child { padding-top: 2px; }
.sec.last { border-bottom: 0; }

/* header bits */
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; }
.topflex { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.badge { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 4px; background: var(--teal-bg); color: var(--teal); font-size: 12px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.1em; text-transform: uppercase; border: 0; text-decoration: none; max-width: 70%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.badge.dark { background: var(--ink); color: var(--paper); }
.iconbtn { width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.iconbtn svg { width: 24px; height: 24px; }
.rest { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.rest .big { font-size: 76px; color: var(--teal); }
.rest .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-bottom: 2px; }
.rest .side .num { font-size: 28px; }

/* buttons */
.btn { min-height: 56px; border-radius: 4px; border: 0; background: var(--teal); color: #fff; font-size: 19px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.06em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; padding: 4px 14px; text-align: center; }
.btn small { font-size: 12px; font-weight: 600; font-stretch: 100%; letter-spacing: 0; text-transform: none; opacity: 0.88; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.line { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn.danger { background: transparent; color: var(--warn); border: 2px solid var(--warn); font-size: 15px; min-height: 48px; }
.btn.danger.armed { background: var(--warn); color: #fff; }
.btn.sm { min-height: 46px; font-size: 15px; }
.btn.row { flex-direction: row; justify-content: space-between; }
.btn svg { width: 22px; height: 22px; }
.btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.btns.even { grid-template-columns: 1fr 1fr; }
.btns.three { grid-template-columns: 1fr 2fr 1fr; }
.textlink { min-height: 44px; display: inline-flex; align-items: center; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 700; color: var(--teal); text-decoration: none; align-self: flex-start; text-align: left; }
.textlink.ink { color: var(--ink); text-decoration: underline; }

/* segmented + chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg button { min-height: 44px; border: 0; background: transparent; font-size: 14px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg.teal button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.seg button.warnon[aria-pressed="true"] { background: var(--warn); color: #fff; }
.chip { min-height: 38px; padding: 0 12px; border-radius: 4px; border: 1.5px solid var(--chip); background: transparent; font-size: 14px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.chip.dark[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.dash { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.chip.sm { min-height: 32px; padding: 0 9px; font-size: 13px; }
.gchip { min-width: 54px; height: 48px; padding: 0 10px; border-radius: 4px; border: 1.5px solid var(--chip); background: transparent; font-size: 26px; font-weight: 900; font-stretch: 62%; }
.gchip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.gridg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.gridg .gchip { min-width: 0; }
.swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.swatch { height: 44px; border-radius: 4px; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.swatch.add { background: transparent; box-shadow: none; border: 1.5px dashed var(--muted); color: var(--muted); display: flex; align-items: center; justify-content: center; }
.dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
.dot.lg { width: 14px; height: 14px; border-radius: 3px; }

/* cards + lists */
.card { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--ink); border-radius: 4px; background: var(--card); }
.card .bigg { font-size: 54px; }
.bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bigbtns button { height: 64px; border-radius: 4px; font-size: 22px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.08em; }
.bigbtns .fell { border: 2.5px solid var(--ink); background: transparent; }
.bigbtns .tick { border: 0; background: var(--teal); color: #fff; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.08em; padding: 3px 6px; border-radius: 3px; background: var(--sand); text-transform: uppercase; }
.pill.dark { background: var(--ink); color: var(--paper); }
.pill.teal { background: var(--teal-bg); color: var(--teal); }
.note { font-size: 12px; color: var(--body); padding: 8px 10px; background: var(--sand); border-radius: 4px; line-height: 1.45; }
.banner { padding: 12px; border-radius: 4px; background: var(--sand); display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.45; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.teal { background: var(--teal-bg); color: var(--teal); }
.prow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 48px; gap: 10px; align-items: center; min-height: 60px; border-bottom: 1px solid var(--rule-soft); }
.prow .g { font-size: 32px; }
.prow .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prow .t b { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.prow .t span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .plus { width: 48px; height: 44px; border-radius: 4px; border: 1.5px solid var(--chip); background: transparent; font-size: 16px; font-weight: 900; }
.prow.warm { opacity: 0.5; }
.prow.nobtn { grid-template-columns: 52px minmax(0, 1fr) auto; }
.lrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; width: 100%; padding: 8px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule-soft); }
.lrow .g { font-size: 36px; }
.lrow .t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lrow .t b { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .t span { font-size: 12px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.1em; padding: 4px 6px; border-radius: 3px; border: 2px solid var(--teal); color: var(--teal); text-transform: uppercase; white-space: nowrap; }
.tag.flash { background: var(--teal); color: #fff; }
.tag.ticked { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tag.quiet { border-color: var(--chip); color: var(--muted); }
.radio { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 54px; width: 100%; padding: 4px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule-soft); }
.radio .o { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; }
.radio .o i { width: 10px; height: 10px; border-radius: 50%; }
.radio[aria-pressed="true"] .o i { background: var(--teal); }
.radio b { font-size: 16px; display: block; }
.radio span.s { font-size: 12px; color: var(--muted); }

/* bars + charts */
.bar { position: relative; height: 10px; background: var(--rule-soft); }
.bar > i { display: block; height: 100%; }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.bar.thin { height: 8px; }
.pyr { display: grid; grid-template-columns: 40px minmax(0, 1fr) 26px; gap: 10px; align-items: center; }
.pyr .w { display: flex; justify-content: center; height: 20px; }
.pyr .w > div { display: flex; height: 20px; border-radius: 2px; overflow: hidden; background: var(--ink); }
.pyr .w i { display: block; height: 20px; background: var(--teal); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; display: inline-block; }
.trend { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px; }
.trend .ax { display: flex; flex-direction: column-reverse; justify-content: space-between; height: 150px; font-size: 15px; font-weight: 900; font-stretch: 62%; color: var(--muted); }
.trend .ax span { height: 0; display: flex; align-items: center; }
.trend .plot { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 150px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.trend .plot > div { position: relative; }
.trend .plot i { position: absolute; left: 50%; }
.trend .xl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); font-size: 12px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.06em; color: var(--muted); text-align: center; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; align-items: end; border-bottom: 2px solid var(--ink); position: relative; }
.cols > i { display: block; background: var(--ink); min-height: 0; }
.cols .avg { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--teal); height: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
.tiles > div { display: flex; flex-direction: column; padding: 12px 0 10px; }
.tiles > div:nth-child(2n) { padding-left: 14px; border-left: 1px solid var(--rule); }
.tiles > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
.tiles .num { font-size: 44px; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats4 > div { display: flex; flex-direction: column; padding: 10px 0 8px; }
.stats4 > div + div { border-left: 1px solid var(--rule); padding-left: 10px; }
.stats4 .num { font-size: 32px; }
.ms { display: grid; grid-template-columns: 14px 52px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.ms .line { display: flex; flex-direction: column; align-items: center; }
.ms .line i:first-child { width: 12px; height: 12px; margin-top: 8px; flex: none; border: 2px solid var(--ink); }
.ms .line i:last-child { width: 2px; flex: 1; background: var(--chip); }
.ms .num { font-size: 30px; line-height: 1.1; }
.ms .t { display: flex; flex-direction: column; gap: 1px; padding: 4px 0 14px; }
.ms .t b { font-size: 14px; }
.ms .t span { font-size: 12px; color: var(--muted); }
.hbar { display: grid; grid-template-columns: 80px minmax(0, 1fr) 30px 36px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.hbar .tr { height: 10px; background: var(--rule-soft); }
.hbar .tr i { display: block; height: 10px; background: var(--ink); }
.hbar .num { font-size: 18px; text-align: right; }
.lr { display: grid; grid-template-columns: 90px repeat(2, minmax(0, 1fr)); align-items: center; min-height: 40px; border-top: 1px solid var(--rule-soft); font-size: 13px; }
.lr .num { font-size: 24px; text-align: center; }
.hist { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 58px; width: 100%; padding: 6px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule-soft); }
.hist .d { font-size: 12px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.08em; color: var(--muted); line-height: 1.35; }
.hist b { font-size: 15px; display: block; }
.hist span.s { font-size: 12px; color: var(--muted); }
.hist .num { font-size: 30px; }
.expander { display: flex; justify-content: space-between; align-items: center; min-height: 56px; width: 100%; padding: 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; }
.expander .pm { font-size: 26px; font-weight: 700; }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; }
.field input, .field select { height: 44px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; font-size: 17px; font-weight: 700; padding: 0 2px; border-radius: 0; width: 100%; min-width: 0; }
.field select { -webkit-appearance: none; appearance: none; }
.field textarea { min-height: 84px; border: 1.5px solid var(--chip); border-radius: 4px; background: #FBFAF7; font-size: 15px; padding: 10px; resize: vertical; width: 100%; line-height: 1.45; }
.field textarea.code { font-size: 13px; min-height: 120px; font-family: ui-monospace, Menlo, monospace; }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 2px solid var(--ink); border-radius: 4px; height: 48px; }
.stepper button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; font-weight: 700; flex: none; }
.stepper .num { font-size: 26px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; }
.ministep { display: flex; align-items: center; gap: 2px; }
.ministep button { width: 40px; height: 40px; border: 1.5px solid var(--ink); border-radius: 4px; background: none; font-size: 20px; font-weight: 700; }
.ministep .num { min-width: 70px; text-align: center; font-size: 22px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 54px; width: 100%; padding: 0; border: 0; border-bottom: 1px solid var(--rule-soft); background: none; text-align: left; }
.switch b { font-size: 15px; display: block; }
.switch span.s { font-size: 12px; color: var(--muted); }
.switch .sw { width: 46px; height: 26px; border-radius: 3px; background: var(--chip); position: relative; flex: none; }
.switch .sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 2px; background: #fff; transition: left 0.12s; }
.switch[aria-checked="true"] .sw { background: var(--teal); }
.switch[aria-checked="true"] .sw i { left: 23px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: none; padding: 0; text-align: left; }
.check .box { width: 24px; height: 24px; border-radius: 3px; border: 2px solid var(--ink); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
.check[aria-checked="true"] .box { background: var(--ink); }
.check .box svg { width: 14px; height: 14px; }
.check b { font-size: 15px; display: block; }
.check span.s { font-size: 12px; color: var(--muted); }
.err { color: var(--warn); font-size: 13px; font-weight: 700; }

/* timer */
.panel { display: flex; flex-direction: column; gap: 4px; padding: 16px 16px 12px; border-radius: 4px; background: var(--sand); }
.panel.on { background: var(--teal); color: #fff; }
.panel .disp { font-size: 150px; text-align: center; padding: 6px 0; letter-spacing: -0.02em; line-height: 0.85; }
.panel .tr { height: 8px; background: var(--rule); }
.panel.on .tr { background: rgba(255,255,255,0.3); }
.panel .tr i { display: block; height: 8px; background: var(--ink); }
.panel.on .tr i { background: #fff; }
.panel .meta { display: flex; justify-content: space-between; font-size: 18px; font-weight: 900; font-stretch: 62%; letter-spacing: 0.04em; padding-top: 6px; }
.panel a { color: inherit; }
.setrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 50px; border-bottom: 1px solid var(--rule-soft); }
.setrow.on { background: var(--teal-bg); }
.setrow .n { font-size: 13px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.06em; color: var(--muted); padding-left: 4px; }
.setrow.on .n { color: var(--teal); }
.setrow .ld { display: flex; flex-direction: column; align-items: flex-end; padding-right: 4px; }
.setrow .ld .num { font-size: 20px; }
.setrow .ld span { font-size: 11px; color: var(--muted); }
.player { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); max-width: 480px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); }
.player.on { background: var(--teal); color: #fff; }
.player .ptop { padding: 14px 12px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
.player .ptr { margin: 0 20px; height: 6px; background: var(--rule); }
.player.on .ptr, .player.on .tr2 { background: rgba(255,255,255,0.28); }
.player .ptr i, .player .tr2 i { display: block; height: 100%; background: currentColor; }
.player .pmain { flex: 1; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.player .pname { margin: 0; font-size: 50px; font-weight: 900; font-stretch: 62%; line-height: 0.92; text-transform: uppercase; }

.toast button { border: 0; background: none; color: var(--paper); font-weight: 800; text-decoration: underline; min-height: 32px; padding: 0 4px; }
